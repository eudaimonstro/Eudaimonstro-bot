name: Review recent forecasts

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to look for resolved questions"
        default: "30"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday morning

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

# Scores how the bot's resolved forecasts turned out. Read-only: it makes no
# forecasts, spends nothing on LLMs, and publishes nothing.
# The weekly run is off by default: set the repository variable REVIEW_BOT_ENABLED to
# true to turn it on. Running it by hand always works.
jobs:
  review_job:
    if: vars.REVIEW_BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with integrations
      - name: Review forecasts
        run: |
          poetry run bot-review review \
            --resolved-since "$DAYS" \
            --output review.json \
            --summary review.md
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          DAYS: ${{ inputs.days || 30 }}
      - name: Save review report
        run: |
          mkdir -p data/reports
          cp review.md "data/reports/$(date -u +%F)-bot-review.md"
      - name: Score A vs. B
        run: poetry run python -m harness.score
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Show reports in the run page
        run: |
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          latest=$(ls -1 data/reports/*-comparison.md 2>/dev/null | tail -n 1); [ -n "$latest" ] && cat "$latest" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit reports
        if: success() || failure()
        run: scripts/commit_data.sh "Weekly review and A vs. B report"
